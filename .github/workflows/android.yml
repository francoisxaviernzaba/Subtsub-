name: Android APK Build

on:
  push:
    branches: [ session/agent_9e964f4d-ffc0-4d42-a2a6-a082467a9eb0 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
      - name: Install dependencies
        run: |
          npm install
          npx cap sync android
      - name: Create debug keystore
        run: |
          mkdir -p android/app
          keytool -genkey -v -keystore android/app/debug.keystore -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -alias androiddebugkey -dname "CN=SUB2SUB, OU=Dev, O=Sub2Sub, L=Rwanda, S=Rwanda, C=RW"
      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sub2sub-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
